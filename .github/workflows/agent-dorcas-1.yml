name: Agent Dorcas 1

on:
  schedule:
    # Mon / Wed / Fri at 13:47 UTC (~9:47am New York). Videos go public at 4pm ET.
    - cron: "47 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | dry-run | branding"
        default: "run"

concurrency: dorcas-1

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core librsvg2-bin
          pip install -r requirements.txt
      - name: Build brand assets (font + PNGs) if missing
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/Poppins-Bold.ttf ] || curl -fsSL -o assets/fonts/Poppins-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          [ -f brand/profile.png ] || rsvg-convert -w 800 -h 800 brand/profile.svg -o brand/profile.png
          [ -f brand/nia_ref.png ] || rsvg-convert -w 1024 -h 1024 --keep-aspect-ratio -b white brand/nia.svg -o brand/nia_ref.png
      - name: Run Dorcas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
          VEO_CLIPS: ${{ vars.VEO_CLIPS }}
          SONG_SECONDS: ${{ vars.SONG_SECONDS }}
          DORCAS_DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
        run: |
          if [ "${{ inputs.mode }}" = "branding" ]; then
            python -m dorcas.main --branding
          else
            python -m dorcas.main
          fi
      - name: Save upload history
        if: success()
        run: |
          git config user.name "Agent Dorcas 1"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Dorcas 1: log upload" && git push)
      - name: Keep the video + plan for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dorcas-run-${{ github.run_number }}
          path: out/
          retention-days: 14
