<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Nia: original mascot for Nia's Rhythm Room -->
  <defs>
    <radialGradient id="skin" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#9A5B34"/>
      <stop offset="1" stop-color="#7A4325"/>
    </radialGradient>
    <radialGradient id="hair" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3A2418"/>
      <stop offset="1" stop-color="#1E120C"/>
    </radialGradient>
  </defs>
  <!-- body / shirt -->
  <path d="M95 440 C100 360 145 330 200 330 C255 330 300 360 305 440 Z" fill="#FF6B3D"/>
  <path d="M170 332 L200 372 L230 332 Z" fill="#FFD23F"/>
  <circle cx="160" cy="400" r="9" fill="#FFD23F"/><circle cx="245" cy="395" r="7" fill="#2EC4B6"/><circle cx="205" cy="420" r="6" fill="#FFFFFF"/>
  <!-- neck -->
  <rect x="178" y="292" width="44" height="46" rx="16" fill="#7A4325"/>
  <!-- afro puffs -->
  <circle cx="92" cy="92" r="70" fill="url(#hair)"/>
  <circle cx="308" cy="92" r="70" fill="url(#hair)"/>
  <!-- puff ties -->
  <ellipse cx="128" cy="140" rx="20" ry="12" fill="#2EC4B6" transform="rotate(-35 128 140)"/>
  <ellipse cx="272" cy="140" rx="20" ry="12" fill="#2EC4B6" transform="rotate(35 272 140)"/>
  <!-- hair cap -->
  <path d="M92 190 C92 110 140 72 200 72 C260 72 308 110 308 190 Z" fill="url(#hair)"/>
  <!-- face -->
  <ellipse cx="200" cy="200" rx="104" ry="110" fill="url(#skin)"/>
  <!-- ears -->
  <circle cx="98" cy="210" r="18" fill="#7A4325"/><circle cx="302" cy="210" r="18" fill="#7A4325"/>
  <!-- headphones -->
  <path d="M84 200 C84 70 316 70 316 200" fill="none" stroke="#FFD23F" stroke-width="16" stroke-linecap="round"/>
  <rect x="62" y="180" width="44" height="72" rx="20" fill="#FFD23F"/>
  <rect x="294" y="180" width="44" height="72" rx="20" fill="#FFD23F"/>
  <rect x="72" y="192" width="24" height="48" rx="12" fill="#FF6B3D"/>
  <rect x="304" y="192" width="24" height="48" rx="12" fill="#FF6B3D"/>
  <!-- hairline edge -->
  <path d="M112 150 C140 112 170 104 200 118 C230 104 260 112 288 150 C262 128 232 126 200 136 C168 126 138 128 112 150 Z" fill="#1E120C"/>
  <!-- eyebrows -->
  <path d="M142 168 Q162 156 182 166" stroke="#1E120C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M218 166 Q238 156 258 168" stroke="#1E120C" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="163" cy="200" rx="17" ry="21" fill="#FFFFFF"/>
  <ellipse cx="237" cy="200" rx="17" ry="21" fill="#FFFFFF"/>
  <circle cx="166" cy="203" r="11" fill="#2B1810"/><circle cx="240" cy="203" r="11" fill="#2B1810"/>
  <circle cx="170" cy="198" r="4" fill="#FFFFFF"/><circle cx="244" cy="198" r="4" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="136" cy="240" rx="16" ry="10" fill="#E0785A" opacity="0.55"/>
  <ellipse cx="264" cy="240" rx="16" ry="10" fill="#E0785A" opacity="0.55"/>
  <!-- nose -->
  <path d="M192 226 Q200 234 208 226" stroke="#5E3119" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M160 252 Q200 298 240 252 Q200 268 160 252 Z" fill="#5A1E14"/>
  <path d="M170 256 Q200 266 230 256 Q200 262 170 256 Z" fill="#FFFFFF"/>
  <path d="M182 276 Q200 288 218 276 Q200 280 182 276 Z" fill="#E86A5C"/>
</svg>
